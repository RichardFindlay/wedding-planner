{% load static planner_tags %}<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe3">
  <meta name="robots" content="noindex, nofollow">
  <title>Richard & Denver · Our Wedding Plan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌲%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'planner/css/app.css' %}">
</head>
<body>
  <main class="who-page">
    {% include "planner/partials/landscape.html" %}
    <div class="who-card rise">
      <span class="script" style="font-size:28px;color:var(--blush-deep)">our wedding plan</span>
      <h1>Richard <span class="amp">&amp;</span> Denver</h1>
      <p>Who’s planning today?</p>
      <form method="post" class="who-choices">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="who-choice rise rise-2" name="who" value="richard" type="submit">{% avatar "richard" "xl" %} Richard</button>
        <button class="who-choice rise rise-3" name="who" value="denver" type="submit">{% avatar "denver" "xl" %} Denver</button>
      </form>
    </div>
  </main>
</body>
</html>
